name: Run Tests

on:
  pull_request:
    branches: [ dev ]
  workflow_dispatch:
  push:
    branches: [ integracion-deploy ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: testdb
      DB_HOST: localhost
      DB_PORT: 5432
      REPORT_ARTIFACT_NAME: test-report-pdf
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      
    - name: Install dependencies
      run: uv sync --frozen
      
    - name: Test plugins
      run: uv pip install pytest pytest-cov pytest-html

    - name: Run migrations (or manually create tables)
      run: |
        uv run alembic upgrade head || echo "Alembic skipped"
        uv run python -c "from app.db.config import create_db_and_tables; create_db_and_tables()"

    - name: Seed database
      run: uv run python -c "from app.db.config import seed_initial_data; seed_initial_data()"

    - name: Run tests with reports and coverage
      run: |
        mkdir -p REPORTES
        uv run pytest \
        --maxfail=5 \
        --tb=short \
        --junitxml=REPORTES/junit.xml \
        --html=REPORTES/pytest_report.html \
        --self-contained-html \
        --cov=app \
        --cov-report=term-missing \
        --cov-report=xml:REPORTES/coverage.xml \
        --cov-report=html:REPORTES/coverage_html \
        --cov-fail-under=85

    - name: Install PDF generation tools
      if: always()
      run: |
        sudo apt-get update
        sudo apt-get install -y wkhtmltopdf poppler-utils

    - name: Download CSS
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CSS_API_URL: https://api.github.com/repos/Letterbox-discovery-recommendations/coverage_reportes/contents/coverage.css?ref=main
      run: |
        set -e
        mkdir -p REPORTES
        curl -w "%{http_code}" -o REPORTES/cover.css \
        -H "Authorization: token ${GH_TOKEN}" \
        -H "Accept: application/vnd.github.v3.raw" \
        -fsSL "${CSS_API_URL}"

    - name: Generate cover page
      if: always()
      run: |
        cat > REPORTES/cover.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <link rel="stylesheet" href="cover.css">
        </head>
        <body>
          <h1>Reporte de Tests y Coverage</h1>
          <h2>{{REPO}}</h2>
          <div class="divider"></div>
          <div class="info"><strong>Ref:</strong> {{REF}}</div>
          <div class="info"><strong>Commit:</strong> {{SHA}}</div>
          <div class="info"><strong>Autor:</strong> {{ACTOR}}</div>
          <div class="info"><strong>Fecha:</strong> {{DATE}}</div>
          <div class="divider"></div>
        </body>
        </html>
        EOF

    - name: Convert REPORTES to PDF and merge
      if: always()
      run: |
        set -e
        # Convert HTML → PDF
        wkhtmltopdf REPORTES/cover.html REPORTES/00_cover.pdf || true
        wkhtmltopdf REPORTES/pytest_report.html REPORTES/01_tests.pdf || true
        wkhtmltopdf REPORTES/coverage_html/index.html REPORTES/02_coverage.pdf || true
        # Merge (solo los existentes)
        PDFs=()
        [ -f REPORTES/00_cover.pdf ] && PDFs+=("REPORTES/00_cover.pdf")
        [ -f REPORTES/01_tests.pdf ] && PDFs+=("REPORTES/01_tests.pdf")
        [ -f REPORTES/02_coverage.pdf ] && PDFs+=("REPORTES/02_coverage.pdf")
        if [ ${#PDFs[@]} -gt 0 ]; then
          pdfunite "${PDFs[@]}" REPORTES/test_coverage_report.pdf
        else
          echo "No hay PDFs para unificar"
        fi
        ls -l REPORTES || true

    - name: Upload test PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.REPORT_ARTIFACT_NAME }}
        path: |
          REPORTES/test_coverage_report.pdf
        if-no-files-found: warn
        retention-days: 1
