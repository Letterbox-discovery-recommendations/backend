name: Run Tests

on:
  pull_request:
    branches: [ dev ]
  push:
    branches: [ workflow-test ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: testdb
      DB_HOST: localhost
      DB_PORT: 5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      
    - name: Install dependencies
      run: uv sync --frozen

    - name: Run migrations
      run: uv run alembic upgrade head
      
    - name: Run tests
      run: uv run pytest --maxfail=5 --maxwarnings=5
      
    - name: Check test coverage
      run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=85
