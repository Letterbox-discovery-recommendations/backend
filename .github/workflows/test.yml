name: Run Tests

on:
  pull_request:
    branches: [ dev ]
  workflow_dispatch:
  push:
    branches: [ integracion-deploy ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: testdb
      DB_HOST: localhost
      DB_PORT: 5432
      REPORT_ARTIFACT_NAME: test-report-pdf
      REPO: D&R Testing Backend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      
    - name: Install dependencies
      run: uv sync --frozen
      
    - name: Test plugins
      run: uv pip install pytest pytest-cov pytest-html

    - name: Prepare REPORTES dir
      run: mkdir -p REPORTES

    - name: Download CSS
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BASE_API: https://api.github.com/repos/Letterbox-discovery-recommendations/coverage_reportes/contents
        REF: main
      run: |
        set -euo pipefail
        download_raw () {
          local file="$1"
          curl -H "Authorization: token ${GH_TOKEN}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -fsSL "${BASE_API}/${file}?ref=${REF}" -o "REPORTES/${file}"
        }
        download_raw cover.css
        download_raw coverage.css
        download_raw pytest.css
        
        ls -l REPORTES

    - name: Generate cover page
      if: always()
      run: |
        cat > REPORTES/cover.html << EOF
        <!DOCTYPE html>
        <html lang="es">
        <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Reporte de Tests y Coverage</title>
          <link rel="stylesheet" href="REPORTES/cover.css" />
        </head>
        <body>
            <div class="container">
              <h1>Reporte de Tests y Coverage</h1>
              <h2>Proyecto: <strong>${{ env.REPO }}</strong></h2>
      
              <div class="divider"></div>
      
              <div class="info">
                <strong> Branch:</strong> ${{ github.ref_name }}
              </div>
              
              <div class="info">
                <strong> Commit:</strong> <code>${{ github.sha }}</code>
              </div>
              
              <div class="info">
                <strong> Fecha:</strong> $(date '+%Y-%m-%d %H:%M:%S UTC')
              </div>
              
              <div class="info">
                <strong> Workflow:</strong> ${{ github.workflow }}
              </div>
      
              <div class="divider"></div>
            </div>
          </body>
          </html>
        EOF

    - name: Run migrations
      run: |
        uv run alembic upgrade head || echo "Alembic skipped"
        uv run python -c "from app.db.config import create_db_and_tables; create_db_and_tables()"

    - name: Seed database
      run: uv run python -c "from app.db.config import seed_initial_data; seed_initial_data()"

    - name: Run tests with reports and coverage
      continue-on-error: true
      run: |
        mkdir -p REPORTES
        uv run pytest \
          --maxfail=5 \
          --tb=short \
          --junitxml=REPORTES/junit.xml \
          --html=REPORTES/pytest_report.html \
          --css=REPORTES/pytest.css \
          --self-contained-html \
          --cov=app \
          --cov-report=term-missing \
          --cov-report=xml:REPORTES/coverage.xml \
          --cov-report=html:REPORTES/coverage_html \
          --cov-fail-under=85

    - name: Create coverage wrapper HTML
      if: always()
      run: |
        set -e
        if [ -f REPORTES/coverage_html/index.html ]; then
          if ! grep -q 'coverage.css' REPORTES/coverage_html/index.html; then
            sed -i '0,/<head[^>]*>/s||\&\
          <link rel="stylesheet" href="REPORTES/coverage.css">|' REPORTES/coverage_html/index.html
            fi
          fi

    - name: Install PDF generation tools
      if: always()
      run: |
        sudo apt-get update
        sudo apt-get install -y wkhtmltopdf poppler-utils

    - name: Convert REPORTES to PDF and merge
      if: always()
      run: |
        set -e
        wkhtmltopdf REPORTES/cover.html REPORTES/00_cover.pdf || true
        wkhtmltopdf REPORTES/pytest_report.html REPORTES/01_tests.pdf || true
        wkhtmltopdf REPORTES/coverage_html/index.html REPORTES/02_coverage.pdf || true
        PDFs=()
        [ -f REPORTES/00_cover.pdf ] && PDFs+=("REPORTES/00_cover.pdf")
        [ -f REPORTES/01_tests.pdf ] && PDFs+=("REPORTES/01_tests.pdf")
        [ -f REPORTES/02_coverage.pdf ] && PDFs+=("REPORTES/02_coverage.pdf")
        if [ ${#PDFs[@]} -gt 0 ]; then
          pdfunite "${PDFs[@]}" REPORTES/test_coverage_report.pdf
        else
          echo "No hay PDFs para unificar"
        fi
        ls -l REPORTES || true

    - name: Upload test PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.REPORT_ARTIFACT_NAME }}
        path: |
          REPORTES/test_coverage_report.pdf
        if-no-files-found: warn
        retention-days: 1
