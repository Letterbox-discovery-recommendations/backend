name: CI Backend
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      run: pip install uv

    - name: Cache uv dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies
      run: |
        uv pip install --system -r pyproject.toml
        uv pip install --system -e ".[dev]"

    - name: Run tests
      run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=term || echo "No tests found"

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: github.event_name == 'push'
      with:
        file: ./coverage.xml

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    
    outputs:
      image-tag: ${{ steps.build-image.outputs.image-tag }}
      image-name: ${{ steps.build-image.outputs.image-name }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
  
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
  
    - name: Build Docker image
      id: build-image
      env:
        IMAGE_TAG: ${{ github.sha }}
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        IMAGE_NAME="fastapi-lambda"
        
        docker build \
          -f Dockerfile \
          -t $IMAGE_NAME:$IMAGE_TAG \
          -t $IMAGE_NAME:$BRANCH_NAME \
          .
        
        if [ "$BRANCH_NAME" = "main" ]; then
          docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
        fi
        
        docker images | grep $IMAGE_NAME
        
        echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "image-name=$IMAGE_NAME" >> $GITHUB_OUTPUT
        
    - name: Save Docker image
      run: |
        docker save fastapi-lambda:${{ steps.build-image.outputs.image-tag }} -o /tmp/fastapi-lambda.tar
      # <-- Aquí guardamos el tar (tu versión actual se olvidaba de hacer el save)
      
    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-${{ steps.build-image.outputs.image-tag }}
        path: /tmp/fastapi-lambda.tar
        retention-days: 1
